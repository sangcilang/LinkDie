user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide Nginx version
    server_tokens off;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # ---------------------------------------------------------------------------
    # Rate limiting zones
    # ---------------------------------------------------------------------------
    # Download zone: 5 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=download:10m rate=5r/m;
    # Upload zone: 2 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/m;
    # General API zone: 30 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    # Request-upload zone: 5 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=request_upload:10m rate=5r/m;

    # ---------------------------------------------------------------------------
    # Upstream services
    # ---------------------------------------------------------------------------
    upstream backend {
        server backend:8080;
        keepalive 32;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 32;
    }

    # ---------------------------------------------------------------------------
    # HTTP → HTTPS redirect
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------------------------------------------------------------------------
    # HTTPS server
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # TLS configuration
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Client body settings
        client_max_body_size 500m;
        client_body_timeout  60s;
        client_header_timeout 10s;

        # ---------------------------------------------------------------------------
        # Security headers (applied globally; CSP is set by Next.js middleware)
        # ---------------------------------------------------------------------------
        add_header X-Content-Type-Options    "nosniff"                          always;
        add_header X-Frame-Options           "DENY"                             always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy           "no-referrer"                      always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin"                     always;
        add_header Cross-Origin-Resource-Policy "same-origin"                   always;
        # Do NOT add Cache-Control here globally — let backend/frontend set it per-route.
        # Do NOT override Content-Security-Policy — Next.js middleware sets it with nonce.

        # ---------------------------------------------------------------------------
        # /metrics — internal only (allow private CIDRs, deny all others)
        # ---------------------------------------------------------------------------
        location /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 127.0.0.1;
            deny all;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ---------------------------------------------------------------------------
        # /health — no rate limit, no auth
        # ---------------------------------------------------------------------------
        location /health {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ---------------------------------------------------------------------------
        # /d/* — download page (CDN cache bypass + rate limit)
        # ---------------------------------------------------------------------------
        location ~ ^/d/ {
            # CDN cache bypass
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma        "no-cache"                            always;

            # Rate limit: 5 r/m, burst 2
            limit_req zone=download burst=2 nodelay;
            limit_req_status 429;

            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Pass through CSP header set by Next.js middleware (do not override)
            proxy_pass_header  Content-Security-Policy;
        }

        # ---------------------------------------------------------------------------
        # /api/download/* — token consumption endpoint (CDN cache bypass)
        # ---------------------------------------------------------------------------
        location ~ ^/api/download/ {
            add_header Cache-Control "no-store, private" always;
            add_header Pragma        "no-cache"          always;

            limit_req zone=api burst=5 nodelay;
            limit_req_status 429;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ---------------------------------------------------------------------------
        # /api/admin/request-upload — tighter rate limit
        # ---------------------------------------------------------------------------
        location = /api/admin/request-upload {
            add_header Cache-Control "no-store" always;

            limit_req zone=request_upload burst=2 nodelay;
            limit_req_status 429;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ---------------------------------------------------------------------------
        # /api/* — general API (CDN cache bypass + rate limit)
        # ---------------------------------------------------------------------------
        location ~ ^/api/ {
            add_header Cache-Control "no-store" always;

            limit_req zone=api burst=10 nodelay;
            limit_req_status 429;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ---------------------------------------------------------------------------
        # /admin/* — admin panel (CDN cache bypass)
        # ---------------------------------------------------------------------------
        location ~ ^/admin/ {
            add_header Cache-Control "no-store" always;

            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Pass through CSP header set by Next.js middleware
            proxy_pass_header  Content-Security-Policy;
        }

        # ---------------------------------------------------------------------------
        # Static assets — Next.js _next/static (cacheable)
        # ---------------------------------------------------------------------------
        location ~ ^/_next/static/ {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_cache_valid  200 1y;
            add_header         Cache-Control "public, max-age=31536000, immutable" always;
        }

        # ---------------------------------------------------------------------------
        # Default — proxy to Next.js frontend
        # ---------------------------------------------------------------------------
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Pass through CSP header set by Next.js middleware
            proxy_pass_header  Content-Security-Policy;
        }
    }
}
